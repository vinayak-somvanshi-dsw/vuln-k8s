---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - security.vinz.in
  resources:
  - vulnimages
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - security.vinz.in
  resources:
  - vulnimages/finalizers
  verbs:
  - update
- apiGroups:
  - security.vinz.in
  resources:
  - vulnimages/status
  verbs:
  - get
  - patch
  - update
